<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейросеть</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 50%, #ccfbf1 100%);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        /* Markdown */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: bold; margin-bottom: 0.5em; margin-top: 1em; color: #1f2937; }
        .markdown-body h1 { font-size: 1.5em; }
        .markdown-body h2 { font-size: 1.25em; }
        .markdown-body p { margin-bottom: 1em; color: #374151; line-height: 1.6; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5em; margin-bottom: 1em; color: #374151; }
        .markdown-body ol { list-style-type: decimal; margin-left: 1.5em; margin-bottom: 1em; color: #374151; }
        .markdown-body code { background-color: #f1f5f9; padding: 0.2em 0.4em; border-radius: 0.25rem; font-size: 0.875em; font-family: monospace; color: #0f172a; }
        .markdown-body pre { background-color: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1em; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .markdown-body pre code { background-color: transparent; padding: 0; color: inherit; }
        .markdown-body a { color: #6366f1; text-decoration: underline; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-3xl relative z-10">
        <a href="/profile" class="inline-flex items-center text-sm font-medium text-indigo-700 hover:text-indigo-900 mb-6 transition-colors bg-white/50 backdrop-blur-md px-4 py-2 rounded-full shadow-sm border border-white/50">
            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Назад в личный кабинет
        </a>
        
        <div class="glass-card rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] w-full p-6 sm:p-10 relative overflow-hidden">
            <div class="absolute -top-20 -right-20 w-48 h-48 bg-gradient-to-br from-purple-400 to-indigo-400 rounded-full blur-3xl opacity-30 pointer-events-none"></div>

            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8 gap-4 relative z-10">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 flex items-center gap-2">
                        <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">Спроси нейросеть</span>
                        <span class="text-2xl animate-pulse">✨</span>
                    </h1>
                    <p class="text-gray-600 mt-1.5 font-medium">GigaChat готов ответить на любые вопросы</p>
                </div>
                <div class="bg-white/80 border border-purple-100 px-4 py-2 rounded-xl text-sm font-semibold text-gray-700 shadow-sm whitespace-nowrap">
                    Цена: <b class="text-purple-600 ml-1">{{ price }} ₽</b>
                </div>
            </div>

            <div class="flex justify-between items-center bg-white/60 border border-white/50 shadow-sm rounded-xl px-5 py-4 mb-8 relative z-10">
                <span class="text-gray-700 font-medium">Ваш баланс:</span>
                <span class="text-xl font-bold text-gray-900"><span id="balance-value">{{ balance }}</span> <span class="text-gray-500 font-medium text-lg">₽</span></span>
            </div>

            <form id="ai-form" class="space-y-4 relative z-10">
                <div class="relative group">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
                    <textarea id="ai-prompt" placeholder="Опиши свою задачу, например: напиши стихотворение про программистов..." required
                        class="relative w-full min-h-[140px] px-5 py-4 bg-white/90 border border-gray-200/50 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all resize-y text-gray-800 shadow-sm text-base leading-relaxed"></textarea>
                </div>
                <div class="flex justify-end">
                    <button type="submit" id="ask-btn"
                        class="inline-flex items-center justify-center bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-medium py-3 px-8 rounded-xl transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5 focus:ring-4 focus:ring-indigo-300 disabled:opacity-70 disabled:cursor-not-allowed">
                        <span>Отправить запрос</span>
                        <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>

            <div class="mt-10 pt-8 border-t border-gray-200/50 relative z-10">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-100 to-purple-100 flex items-center justify-center border border-indigo-200">
                        <span class="text-indigo-600 text-sm">🤖</span>
                    </div>
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider">Ответ GigaChat</h3>
                </div>

                <div id="ai-answer-container" class="hidden">
                    <div id="ai-answer" class="markdown-body bg-white/80 p-6 sm:p-8 rounded-2xl border border-white/50 shadow-sm">
                        <!-- Ответ будет здесь -->
                    </div>
                </div>
                <div id="ai-empty-state" class="flex flex-col items-center justify-center py-12 text-gray-400 bg-white/40 border-2 border-dashed border-gray-200/50 rounded-2xl">
                    <svg class="w-12 h-12 mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    <span>Здесь появится магия...</span>
                </div>
                <!-- Лоадер -->
                <div id="ai-loader" class="hidden flex flex-col items-center justify-center py-12 bg-white/40 border border-gray-200/50 rounded-2xl">
                    <div class="relative w-12 h-12">
                        <div class="absolute inset-0 rounded-full border-t-2 border-indigo-600 animate-spin"></div>
                        <div class="absolute inset-2 rounded-full border-t-2 border-purple-500 animate-spin" style="animation-direction: reverse;"></div>
                    </div>
                    <span class="mt-4 text-sm font-medium text-gray-500 animate-pulse">Генерирую ответ...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
