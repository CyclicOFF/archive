<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 50%, #ccfbf1 100%);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="glass-card rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] w-full max-w-lg p-8 sm:p-10 relative overflow-hidden">
        <div class="absolute -top-20 -right-20 w-48 h-48 bg-gradient-to-br from-purple-400 to-indigo-400 rounded-full blur-3xl opacity-30 pointer-events-none"></div>
        <div class="absolute -bottom-20 -left-20 w-48 h-48 bg-gradient-to-tr from-teal-300 to-emerald-300 rounded-full blur-3xl opacity-30 pointer-events-none"></div>

        <div class="text-center mb-8 relative z-10">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Личный кабинет</h1>
            <div class="text-indigo-700 bg-indigo-50/80 border border-indigo-100 inline-block px-4 py-1.5 rounded-full text-sm font-medium">{{ user.email }}</div>
        </div>

        <div class="space-y-4 mb-8 relative z-10">
            <div class="flex justify-between items-center py-3 border-b border-gray-200/50">
                <span class="text-gray-600 font-medium">Имя</span>
                <span class="text-gray-900 font-semibold">{{ user.username }}</span>
            </div>
            <div class="flex justify-between items-center py-3 border-b border-gray-200/50">
                <span class="text-gray-600 font-medium">Фамилия</span>
                <span class="text-gray-900 font-semibold">{{ user.surname or '—' }}</span>
            </div>
        </div>

        <div class="bg-gradient-to-br from-indigo-500 via-purple-500 to-fuchsia-500 rounded-2xl p-8 text-white text-center mb-8 shadow-xl relative z-10 overflow-hidden">
            <div class="absolute inset-0 bg-white/10 opacity-0 hover:opacity-100 transition-opacity"></div>
            <div class="text-indigo-100 font-medium mb-2 text-lg">Ваш баланс</div>
            <div class="text-5xl font-bold tracking-tight">{{ user.balance }} <span class="text-3xl font-medium text-indigo-100">₽</span></div>
        </div>

        {% if user.is_admin %}
        <a href="/admin" class="relative z-10 block w-full text-center bg-rose-50/80 text-rose-600 hover:bg-rose-100 font-semibold py-3.5 rounded-xl transition-colors mb-4 border border-rose-200 shadow-sm">
            👑 Панель администратора
        </a>
        {% endif %}

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8 relative z-10">
            <button id="send-money-btn" type="button" class="bg-white/80 text-teal-700 hover:bg-teal-50 hover:border-teal-300 font-semibold py-3.5 rounded-xl transition-colors border border-gray-200 shadow-sm">
                💸 Отдать деньги
            </button>
            <a href="/ai" class="flex items-center justify-center bg-gradient-to-r from-indigo-600 to-purple-600 text-white hover:from-indigo-700 hover:to-purple-700 font-semibold py-3.5 rounded-xl transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                ✨ Спросить нейросеть
            </a>
        </div>

        <a href="/logout" class="relative z-10 block text-center text-gray-500 hover:text-gray-700 font-medium text-sm transition-colors">
            Выйти из аккаунта
        </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
